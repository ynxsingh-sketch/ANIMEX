name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=$JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $RAW_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            echo "Error: Unable to detect Java version." >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -ge 0 ] 2>/dev/null; then
            echo "Error: Java major version could not be parsed as an integer." >&2
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($MAJOR_VERSION) is lower than 17. Java 17 or newer is required." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE="./debug.keystore"
          if [ -f "$KEYSTORE" ]; then
            echo "Existing debug.keystore found at $KEYSTORE. Reusing."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore "$KEYSTORE" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000

            if [ ! -f "$KEYSTORE" ]; then
              echo "Error: Failed to generate temporary debug keystore at $KEYSTORE." >&2
              exit 1
            fi
            echo "Temporary debug keystore generated successfully at $KEYSTORE."
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK" >&2
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK at $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: Expected APK file does not have .apk extension: $EXPECTED_APK" >&2
              exit 1
              ;;
          esac

          echo "Verified debug APK exists and is valid:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Source APK $SOURCE_APK does not exist." >&2
            exit 1
          fi

          TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_FILE="$TEMP_DIR/$ASSET_FILENAME"

          cp "$SOURCE_APK" "$DEST_FILE"

          if [ ! -f "$DEST_FILE" ] || [ ! -s "$DEST_FILE" ]; then
            echo "Error: Failed to prepare non-empty release asset at $DEST_FILE" >&2
            exit 1
          fi

          echo "Prepared APK release asset at $DEST_FILE ($(stat -c%s "$DEST_FILE" 2>/dev/null || wc -c < "$DEST_FILE") bytes)"
          echo "asset_path=$DEST_FILE" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset ($ASSET_PATH) is missing or empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset ($ASSET_PATH) does not have .apk extension." >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build

          This is an automatically generated debug APK.
          - **Built by:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`

          > **Notice:** This APK is intended for testing purposes only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$OUTCOME" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Released Successfully"
              echo ""
              echo "The debug APK was built and published to GitHub Releases:"
              echo "- **Release Page:** [$RELEASE_TAG]($RELEASE_URL)"
              echo "- **Direct Download:** Download \`$ASSET_NAME\` directly from the **Assets** section of the release page."
              echo "- **Actions Artifact:** The build artifact \`app-debug-apk\` is also available as a backup under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the APK build and artifact upload succeeded."
            echo "Artifact named 'app-debug-apk' remains available for download from GitHub Actions."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publish Warning)"
              echo ""
              echo "The debug APK was successfully compiled and preserved as a GitHub Actions artifact."
              echo "- **Actions Artifact:** Download \`app-debug-apk\` from the Artifacts section of this workflow run."
              echo "- **Release Publishing Note:** Automatic release publication encountered an issue, but your build artifact remains safe and available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
